html, body {

}
.dato .rest {

  font-size: clamp(13px, 1.7vw, 18px); font-weight: 500;

}

/* ── Huskelinje ── */

.husk {

}
.husk-liste { display: flex; flex-wrap: wrap; gap: 7px 18px; align-items: center; min-width: 0; }

<body>
<div class="tavle">
  <header class="topp">
    <div class="dato">
      <span class="dag" id="ukedag">—</span>
      <span class="rest" id="datorest">—</span>
    </div>
    <div class="hoyre">
      <div class="vaer" id="vaer"><span>Henter vær</span></div>
      <div class="klokke" id="klokke">--:--</div>
    </div>
  </header>

  <main class="rutenett" id="rutenett"></main>

  <footer class="husk">
    <span class="husk-merkelapp">Husk i dag</span>
    <div class="husk-liste" id="husk"></div>
  </footer>
</div>
<div class="status" id="status"></div>

<script>
const UKEDAGER = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const MAANEDER = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];

const tilDesimal = t => { const [h,m] = t.split(':').map(Number); return h + m/60; };

const finnBarn = id => id === 'familie'
  ? { id:'familie', navn: CONFIG.familie.navn, farge: CONFIG.familie.farge, undertekst:'' }
  : CONFIG.barn.find(b => b.id === id);

const posisjon = t => ((t - CONFIG.dagStart) / (CONFIG.dagSlutt - CONFIG.dagStart)) * 100;
const naaDesimal = () => { const n = new Date(); return n.getHours() + n.getMinutes()/60; };

const overlapper = (a, b) =>
  tilDesimal(a.start) < tilDesimal(b.slutt) && tilDesimal(b.start) < tilDesimal(a.slutt);

function ukenummer(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dag = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dag);
  const start = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - start) / 86400000 + 1) / 7);
}


/* ══════════════════════════════════════════════════════════
   DATAKILDE
   ══════════════════════════════════════════════════════════ */

async function hentData() {
  const idag = new Date();
  const ukedag = idag.getDay();
  const uke = ukenummer(idag);
  const alleBarn = [...CONFIG.barn.map(b => b.id), 'familie'];

  // Henter kalenderdata generert av GitHub Actions.
  // Feiler den, faller tavla tilbake på testdataene uten å kræsje.
  let fraKalender = [];
  let heldagsKalender = [];

  try {
    const svar = await fetch('data/kalender.json?v=' + Date.now());
    if (svar.ok) {
      const fil = await svar.json();
      const noekkel = `${idag.getFullYear()}-`
        + `${String(idag.getMonth() + 1).padStart(2, '0')}-`
        + `${String(idag.getDate()).padStart(2, '0')}`;
      const idagsPoster = fil.dager?.[noekkel] || [];
      fraKalender     = idagsPoster.filter(p => !p.heldags);
      heldagsKalender = idagsPoster.filter(p =>  p.heldags);
    }
  } catch (e) {
    console.warn('Ingen kalenderdata tilgjengelig ennå.', e);
  }

  const dagens  = [...TESTDATA.hendelser, ...fraKalender];
  const heldags = [...TESTDATA.heldags, ...heldagsKalender];
  const husk    = [...TESTDATA.husk];

  const rammer = [];
  let poster = [];

  alleBarn.forEach(id => {
    (RAMMER[id]?.[ukedag] || []).forEach(r => rammer.push({ ...r, barn: id }));

    const fag = (FAGPLAN[id]?.[ukedag] || [])
      .map(f => ({ ...f, type: f.viktig ? 'spesiell' : 'okt' }));

    // AKS-aktiviteter for gjeldende uke
    const aksIdag = (id === 'sofia' ? (AKS[uke]?.[ukedag] || []) : [])
      .filter(Boolean)
      .map((tittel, i) => ({
        tittel,
        start: CONFIG.aksTider[i]?.[0],
        slutt: CONFIG.aksTider[i]?.[1],
        type: 'okt'
      }))
      .filter(a => a.start);

    const faste = [...fag, ...aksIdag, ...(RUTINER[id] || [])]
      .map(p => ({ ...p, barn: id, kilde: p.kilde || 'fast' }));

    const dagensForBarn = dagens.filter(d => d.barn === id);
    const beholdt = faste.filter(f => !dagensForBarn.some(d => overlapper(f, d)));

    poster = poster.concat(beholdt, dagensForBarn);
  });

  // Gym krever gymtøy — legges automatisk i huskelinja
  poster.filter(p => p.tittel === 'Gym').forEach(p => {
    if (!husk.some(h => h.tekst === 'Gymtøy')) husk.unshift({ barn: p.barn, tekst: 'Gymtøy' });
  });

  return { rammer, poster, heldags, husk, uke };
}


/* ══════════════════════════════════════════════════════════
   TEGNING
   ══════════════════════════════════════════════════════════ */

let sisteData = null;

function tegnRutenett(data) {
  const rutenett = document.getElementById('rutenett');
  const kolonner = [...CONFIG.barn.map(b => b.id), 'familie'];
  rutenett.style.setProperty('--kolonner', kolonner.length);
  rutenett.innerHTML = '';

  const akseKol = document.createElement('div');
  akseKol.className = 'kol';
  akseKol.innerHTML = '<div class="kol-topp">&nbsp;</div><div class="akse" id="akse"></div>';
  rutenett.appendChild(akseKol);

  if (!data.poster.length && !data.heldags.length) {
    const m = document.createElement('div');
    m.className = 'helg-melding';
    m.innerHTML = '<strong>Fri i dag</strong><span>Ingenting er planlagt</span>';
    rutenett.appendChild(m);
    return;
  }

  kolonner.forEach(id => {
    const barn = finnBarn(id);
    const kol = document.createElement('div');
    kol.className = 'kol';
    kol.style.setProperty('--f', barn.farge);

    const heldags = data.heldags.filter(h => h.barn === id);

    kol.innerHTML = `
      <div class="kol-topp">
        <div class="kol-navn">${barn.navn}</div>
        ${barn.undertekst ? `<div class="kol-under">${barn.undertekst}</div>` : ''}
        ${heldags.length ? `<div class="heldags">${heldags.map(h => `<span class="${h.stengt ? 'stengt' : ''}">${h.tittel}</span>`).join('')}</div>` : ''}
      </div>
      <div class="spor"></div>`;

    const spor = kol.querySelector('.spor');

    for (let t = Math.ceil(CONFIG.dagStart); t <= Math.floor(CONFIG.dagSlutt); t++) {
      const s = document.createElement('div');
      s.className = 'strek';
      s.style.top = posisjon(t) + '%';
      spor.appendChild(s);
    }

    data.rammer.filter(r => r.barn === id).forEach(r => spor.appendChild(lagRamme(r)));
    data.poster.filter(p => p.barn === id).forEach(p => spor.appendChild(lagPost(p)));

    rutenett.appendChild(kol);
  });

  tegnTidsakse();
  tegnNaaLinje();
}

function lagRamme(r) {
  const start = Math.max(tilDesimal(r.start), CONFIG.dagStart);
  const slutt = Math.min(tilDesimal(r.slutt), CONFIG.dagSlutt);
  const el = document.createElement('div');
  el.className = 'ramme';
  el.style.top = posisjon(start) + '%';
  el.style.height = (posisjon(slutt) - posisjon(start)) + '%';
  el.innerHTML = `<span class="r-navn">${r.tittel}</span>`;
  return el;
}

function lagPost(p) {
  const start = Math.max(tilDesimal(p.start), CONFIG.dagStart);
  const slutt = Math.min(tilDesimal(p.slutt), CONFIG.dagSlutt);
  const hoyde = posisjon(slutt) - posisjon(start);

  const el = document.createElement('div');
  el.className = 'post ' + (p.type || 'okt');
  el.dataset.start = start;
  el.dataset.slutt = slutt;
  el.style.top = posisjon(start) + '%';
  el.style.height = hoyde + '%';
  if (hoyde < 4) el.classList.add('smal');

  const tid = `${p.start}–${p.slutt}`;
  const meta = p.sted ? `${tid} · ${p.sted}` : tid;

  el.innerHTML = `
    <div class="p-tittel">${p.tittel}</div>
    <div class="p-meta">${meta}</div>
    ${p.kilde === 'mykid' ? '<div class="merke"></div>' : ''}`;

  return el;
}

function tegnTidsakse() {
  const akse = document.getElementById('akse');
  if (!akse) return;
  akse.innerHTML = '';
  for (let t = Math.ceil(CONFIG.dagStart); t <= Math.floor(CONFIG.dagSlutt); t++) {
    const el = document.createElement('div');
    el.className = 'time';
    el.style.top = posisjon(t) + '%';
    el.textContent = String(t).padStart(2,'0') + ':00';
    akse.appendChild(el);
  }
}

function tegnNaaLinje() {
  document.querySelector('.naa-linje')?.remove();
  const naa = naaDesimal();
  if (naa < CONFIG.dagStart || naa > CONFIG.dagSlutt) return;

  const rutenett = document.getElementById('rutenett');
  const spor = document.querySelector('.spor');
  if (!spor) return;

  const sb = spor.getBoundingClientRect();
  const rb = rutenett.getBoundingClientRect();
  const topp = (sb.top - rb.top) + sb.height * (posisjon(naa) / 100);

  const n = new Date();
  const klokke = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;

  const linje = document.createElement('div');
  linje.className = 'naa-linje';
  linje.style.top = topp + 'px';
  linje.innerHTML = `<div class="etikett">${klokke}</div><div class="bjelke"></div><div class="kule"></div>`;
  rutenett.appendChild(linje);

  document.querySelectorAll('.post').forEach(el => {
    const s = parseFloat(el.dataset.start), sl = parseFloat(el.dataset.slutt);
    el.classList.toggle('ferdig', sl < naa);
    el.classList.toggle('paagaar', s <= naa && naa < sl);
  });
}

function tegnHusk(husk) {
  const boks = document.getElementById('husk');
  if (!husk.length) { boks.innerHTML = '<span class="husk-tom">Ingenting spesielt i dag</span>'; return; }
  boks.innerHTML = husk.map(h => {
    const b = finnBarn(h.barn);
    return `<div class="husk-post" style="--f:${b.farge}"><i></i><span>${h.tekst}</span></div>`;
  }).join('');
}

/* ── Klokke, dato, nattmodus ── */

let sisteDato = null;

function oppdaterKlokke() {
  const n = new Date();
  document.getElementById('klokke').textContent =
    `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  document.getElementById('ukedag').textContent = UKEDAGER[n.getDay()];
  document.getElementById('datorest').textContent =
    `${n.getDate()}. ${MAANEDER[n.getMonth()]} · Uke ${ukenummer(n)}`;

  const time = n.getHours();
  document.body.classList.toggle('natt', time >= CONFIG.nattFra || time < CONFIG.nattTil);

  const nokkel = n.toDateString();
  if (sisteDato && sisteDato !== nokkel) last();
  sisteDato = nokkel;

  if (sisteData) tegnNaaLinje();
}

/* ── Vær ── */

const VAERKODER = {
  0:'Klart',1:'Lettskyet',2:'Delvis skyet',3:'Skyet',45:'Tåke',48:'Tåke',
  51:'Yr',53:'Yr',55:'Yr',61:'Regn',63:'Regn',65:'Kraftig regn',
  66:'Sludd',67:'Sludd',71:'Snø',73:'Snø',75:'Mye snø',77:'Snø',
  80:'Regnbyger',81:'Regnbyger',82:'Kraftige byger',85:'Snøbyger',86:'Snøbyger',
  95:'Torden',96:'Torden',99:'Torden'
};

async function hentVaer() {
  const { lat, lon } = CONFIG.sted;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,weather_code`
    + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=Europe%2FOslo&forecast_days=1`;
  try {
    const d = await (await fetch(url)).json();
    const naa = Math.round(d.current.temperature_2m);
    const maks = Math.round(d.daily.temperature_2m_max[0]);
    const min = Math.round(d.daily.temperature_2m_min[0]);
    const nedbor = d.daily.precipitation_probability_max[0];
    document.getElementById('vaer').innerHTML =
      `<span class="grader">${naa}°</span><span>${VAERKODER[d.current.weather_code] || ''}</span>`
      + `<span>${min}° / ${maks}°</span>`
      + (nedbor >= 30 ? `<span>${nedbor}% nedbør</span>` : '');
  } catch { document.getElementById('vaer').innerHTML = '<span>Vær utilgjengelig</span>'; }
}

/* ── Oppstart ── */

async function last() {
  const status = document.getElementById('status');
  try {
    sisteData = await hentData();
    tegnRutenett(sisteData);
    tegnHusk(sisteData.husk);
    status.classList.remove('feil');
  } catch (e) { console.error(e); status.classList.add('feil'); }
}

oppdaterKlokke();
last();
hentVaer();

setInterval(oppdaterKlokke, 15000);
setInterval(last, CONFIG.dataIntervallMin * 60 * 1000);
setInterval(hentVaer, 20 * 60 * 1000);
window.addEventListener('resize', () => { if (sisteData) tegnRutenett(sisteData); });

if ('wakeLock' in navigator) {
  const hold = () => navigator.wakeLock.request('screen').catch(() => {});
  hold();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') hold();
  });
}
</script>
