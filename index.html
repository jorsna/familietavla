<style>
:root {
  /* Mørk palett — brukes om kvelden */
  --ink:       #0E121A;
  --panel:     #171E2A;
  --line:      #2B3547;
  --line-svak: #1D2534;
  --tekst:     #EBF0F8;
  --tekst-dus: #7E8EA6;
  --naa:       #FF5E6C;
  --mat:       #C9A227;
  --regn:      #4B8FD6;

  --mat-tekst:  var(--mat-tekst);
  --regn-tekst: var(--regn-tekst);
  --naa-tekst:  var(--naa-tekst);
  --glitter:    var(--glitter);
}

/* ══════════════════════════════════════════════════════════
   LYS PALETT — standard
   Ikke ren hvit. Et kjøkken har varmt lys, og #FFF blir hardt
   mot veggen. Barnefargene byttes samtidig i JavaScript, siden
   de mørke variantene ikke har nok kontrast mot lys bakgrunn.
   ══════════════════════════════════════════════════════════ */

body.lys {
  --ink:       #F4F2ED;
  --panel:     #FFFFFF;
  --line:      #DCD7CD;
  --line-svak: #E9E5DD;
  --tekst:     #191D25;
  --tekst-dus: #6C7482;
  --naa:       #D2334A;
  --mat:       #9C7407;
  --regn:      #2B6AB4;

  --mat-tekst:  #7A5A00;
  --regn-tekst: #1E5799;
  --naa-tekst:  #8E1B2C;
  --glitter:    #E0A81E;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%; overflow: hidden;
  background: var(--ink); color: var(--tekst);
  font-family: 'Barlow', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

body { transition: background-color 1.2s ease, color 1.2s ease; }

.tavle {
  height: 100vh; height: 100dvh;
  display: grid; grid-template-rows: auto 1fr auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ── Topplinje ── */

.topp {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 13px 22px 11px; border-bottom: 1px solid var(--line);
}
.venstre { display: flex; align-items: baseline; gap: 11px; min-width: 0; }
.dag {
  font-family: 'Anton', Impact, sans-serif;
  font-size: clamp(22px, 3.2vw, 34px);
  text-transform: uppercase; letter-spacing: 0.02em; line-height: 1;
}
.datorest {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(12px, 1.5vw, 16px); font-weight: 500;
  color: var(--tekst-dus); text-transform: uppercase;
  letter-spacing: 0.09em; white-space: nowrap;
}

.dagvalg { display: flex; gap: 3px; background: var(--panel); border-radius: 5px; padding: 3px; }
.dagvalg button {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12.5px; font-weight: 600; letter-spacing: 0.11em;
  text-transform: uppercase; color: var(--tekst-dus);
  background: transparent; border: none; border-radius: 3px;
  padding: 5px 12px; cursor: pointer;
}
.dagvalg button.aktiv { background: var(--line); color: var(--tekst); }

/* Stjerneknappen er barnas inngang og skal skille seg ut fra
   de tre visningsbryterne, som er for voksne. */
.dagvalg button.stjerneknapp {
  color: var(--mat);
  background: color-mix(in srgb, var(--mat) 15%, transparent);
  margin-left: 4px;
}
.dagvalg button.stjerneknapp:active { transform: scale(0.96); }

/* Vises bare der nettleseren faktisk støtter fullskjerm.
   På iPad er Legg til på Hjem-skjerm den riktige veien. */
.dagvalg button.temaknapp { padding: 5px 10px; font-size: 15px; letter-spacing: 0; }
.dagvalg button.fullskjerm { padding: 5px 10px; font-size: 14px; letter-spacing: 0; }
.dagvalg button.fullskjerm[hidden] { display: none; }

.hoyre { display: flex; align-items: center; gap: 18px; }
.vaertopp {
  display: flex; align-items: baseline; gap: 9px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(12px, 1.5vw, 16px); font-weight: 500;
  color: var(--tekst-dus); text-transform: uppercase;
  letter-spacing: 0.06em; white-space: nowrap;

}
.kol-under {

.mangler {

  font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase;

}

.heldags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.heldags span {

.akse { position: relative; }
.akse .time {
  position: absolute; left: 0; right: 0; transform: translateY(-50%);

}

.spor { position: relative; overflow: hidden; }

/* ── Værkolonnen ── */

.vaerkol .kol-topp { padding: 9px 8px 7px; }
.vaerkol .kol-navn { color: var(--tekst-dus); font-size: clamp(12px, 1.5vw, 16px); }
.vaer-merker {

.ramme {

.naa-linje { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; z-index: 30; }
.naa-linje .bjelke {
  position: absolute; left: 48px; right: 0; height: 1.5px;
  background: linear-gradient(90deg, var(--naa) 0%, color-mix(in srgb, var(--naa) 50%, transparent) 100%);
  transform: translateY(-50%);
}
.naa-linje .kule {
  position: absolute; left: 48px; width: 10px; height: 10px; margin-left: -5px;
  border-radius: 50%; background: var(--naa); transform: translateY(-50%);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--naa) 20%, transparent);
  animation: puls 3.4s ease-in-out infinite;
}
@keyframes puls {
  0%,100% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--naa) 20%, transparent); }
  50%     { box-shadow: 0 0 0 9px color-mix(in srgb, var(--naa) 5%, transparent); }
}
.naa-linje .etikett {
  position: absolute; left: 0; width: 48px; transform: translateY(-50%);
  padding-right: 7px; text-align: right;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 600; color: var(--naa);
  font-variant-numeric: tabular-nums;
}
@media (prefers-reduced-motion: reduce) { .naa-linje .kule { animation: none; } }

/* ── Huskelinje ── */

.husk {
  display: flex; align-items: center; gap: 18px;
  padding: 10px 22px; border-top: 1px solid var(--line);
  background: var(--panel); min-height: 52px;
}
.husk-merkelapp {
  font-family: 'Anton', Impact, sans-serif;
  font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--tekst-dus); flex-shrink: 0;
}
.husk-liste { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; min-width: 0; }
.husk-post { display: flex; align-items: center; gap: 7px; font-size: clamp(13px, 1.5vw, 17px); font-weight: 500; }
.husk-post i { width: 8px; height: 8px; border-radius: 50%; background: var(--f); flex-shrink: 0; }
.husk-post.ai i { background: transparent; box-shadow: inset 0 0 0 2px var(--f); }
.husk-tom { color: var(--tekst-dus); font-size: 15px; }

.status { position: fixed; right: 7px; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: #3FB8A5; opacity: 0.3; z-index: 50; }
.status.feil { background: var(--naa); opacity: 0.8; }

/* ══════════════════════════════════════════════════════════
   UKESVISNING — søndagsverktøyet
   ══════════════════════════════════════════════════════════ */

.uke {
  overflow: auto; padding: 0 0 4px;
  display: grid;
  grid-template-columns: 96px repeat(7, minmax(132px, 1fr));
}
.uke[hidden] { display: none; }

.uke-celle {
  border-right: 1px solid var(--line-svak);
  border-bottom: 1px solid var(--line-svak);
  padding: 8px 9px; min-width: 0;
}

.uke-hode {
  position: sticky; top: 0; z-index: 10;
  background: var(--ink);
  border-bottom: 1px solid var(--line);
  padding: 9px;
}
.uke-hode .ud {
  font-family: 'Anton', Impact, sans-serif;
  font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em;
  line-height: 1;
}
.uke-hode .ud-dato {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
  color: var(--tekst-dus); margin-top: 3px;
}
.uke-hode.idag .ud { color: var(--naa); }
.uke-hode.helg .ud { color: var(--tekst-dus); }

.uke-navn {
  position: sticky; left: 0; z-index: 12;
  background: var(--ink);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line-svak);
  padding: 8px 9px;
  display: flex; align-items: center;
  font-family: 'Anton', Impact, sans-serif;
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--f);
}
.uke-hjorne {
  position: sticky; left: 0; z-index: 14; background: var(--ink);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
}

.ue {
  font-size: 13px; font-weight: 600; line-height: 1.2;
  padding: 2px 0 2px 7px; border-left: 2px solid var(--f);
  margin-bottom: 5px;
}
.ue small {
  display: block; font-family: 'Barlow Condensed', sans-serif;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--tekst-dus); margin-top: 1px;
}
.ue.stengt { border-left-color: var(--naa); color: var(--naa-tekst); }
.ue.middag { border-left-color: var(--mat); color: var(--mat-tekst); }

.uke-rad-middag .uke-navn { color: var(--mat); }

/* ── Varsel om stengte dager ── */

.stengtstripe {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 22px;
  border-top: 1px solid color-mix(in srgb, var(--naa) 40%, transparent);
  background: color-mix(in srgb, var(--naa) 14%, var(--panel));
}
.stengtstripe[hidden] { display: none; }
.stengtstripe b {
  font-family: 'Anton', Impact, sans-serif;
  font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--naa); flex-shrink: 0;
}
.stengtstripe span { font-size: 14.5px; font-weight: 500; color: var(--naa-tekst); }


/* ══════════════════════════════════════════════════════════
   STJERNESIDEN
   Barna nedover, oppgavene bortover. Store trykkflater,
   symboler framfor tekst. Sebastian er fire og leser ikke.
   ══════════════════════════════════════════════════════════ */

.stjerneside {
  position: fixed; inset: 0; z-index: 80;
  background: var(--ink);
  display: flex; flex-direction: column;
  overflow: auto;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.stjerneside[hidden] { display: none; }

.ss-topp {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--ink); z-index: 5;
}
.ss-tilbake {
  display: flex; align-items: center; gap: 9px;
  background: var(--panel); border: none; border-radius: 9px;
  padding: 12px 18px; cursor: pointer; color: var(--tekst);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 600; letter-spacing: 0.11em;
  text-transform: uppercase;
}
.ss-tilbake:active { transform: scale(0.96); }
.ss-tilbake .pil { font-size: 19px; line-height: 1; }
.ss-tittel {
  font-family: 'Anton', Impact, sans-serif;
  font-size: clamp(20px, 2.6vw, 30px);
  text-transform: uppercase; letter-spacing: 0.04em;
}

/* Rutenettet: navn + én kolonne per oppgave */

.ss-rutenett {
  display: grid;
  grid-template-columns: minmax(120px, 190px) repeat(var(--oppgaver, 3), 1fr);
  gap: 10px; padding: 16px 18px 8px;
}

.ss-hodecelle {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 6px 4px;
}
.ss-hodecelle .he { font-size: clamp(28px, 3.4vw, 40px); line-height: 1; }
.ss-hodecelle .ht {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--tekst-dus);
  text-align: center; line-height: 1.2;
}

.ss-navncelle {
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
  padding: 10px 4px; min-width: 0;
}
.ss-navn {
  font-family: 'Anton', Impact, sans-serif;
  font-size: clamp(20px, 2.5vw, 30px);
  text-transform: uppercase; letter-spacing: 0.03em;
  line-height: 1; color: var(--f);
}
.ss-bank {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--tekst-dus);
  cursor: pointer; user-select: none;
}
.ss-bank b { color: var(--mat); font-size: 16px; }

/* Selve trykkflaten */

.orute {
  position: relative; overflow: hidden;
  aspect-ratio: 1 / 1; max-height: 132px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 14px; cursor: pointer;
  background: var(--panel);
  border: 2px solid var(--line-svak);
  font-size: clamp(30px, 3.6vw, 46px);
  transition: transform 0.12s ease, background 0.25s ease, border-color 0.25s ease;
}
.orute:active { transform: scale(0.94); }
.orute .sym { opacity: 0.3; transition: opacity 0.25s ease; }
.orute .hake {
  position: absolute; font-size: 0.86em; line-height: 1;
  opacity: 0; transform: scale(0.4) rotate(-25deg);
  transition: opacity 0.2s ease, transform 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
}

.orute.gjort {
  background: color-mix(in srgb, var(--f) 26%, var(--panel));
  border-color: color-mix(in srgb, var(--f) 70%, transparent);
}
.orute.gjort .sym { opacity: 0; }
.orute.gjort .hake { opacity: 1; transform: scale(1) rotate(0deg); }

.orute.senere { opacity: 0.35; }

/* Konfetti */

.konfetti {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}
.konfetti i {
  position: absolute; top: 50%; left: 50%;
  width: 7px; height: 11px; border-radius: 1px;
  animation: sprut 1s ease-out forwards;
}
@keyframes sprut {
  0%   { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }
  100% { opacity: 0;
         transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)); }
}

/* Ukesoversikt nederst */

.ss-uke { padding: 10px 18px 26px; }
.ss-uke h3 {
  font-family: 'Anton', Impact, sans-serif;
  font-size: 14px; letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--tekst-dus); margin-bottom: 10px;
}
.ss-uketabell {
  display: grid;
  grid-template-columns: minmax(96px, 150px) repeat(7, 1fr) minmax(58px, 74px);
  gap: 5px; align-items: center;
}
.ss-ukehode {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--tekst-dus); text-align: center;
}
.ss-ukehode.idag { color: var(--naa); }
.ss-ukenavn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--f);
}
.ss-dag {
  height: 30px; border-radius: 6px; background: var(--line-svak);
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700; color: var(--tekst-dus);
}
.ss-dag.noe { background: color-mix(in srgb, var(--f) 30%, var(--panel)); color: var(--tekst); }
.ss-dag.full { background: color-mix(in srgb, var(--mat) 40%, var(--panel)); color: var(--glitter); }
.ss-sum {
  text-align: center; font-weight: 700; font-size: 15px; color: var(--mat);
  font-variant-numeric: tabular-nums;
}

.ss-melding {
  padding: 14px 18px; color: var(--tekst-dus); font-size: 14px;
}

/* Glitrende navn i dagsvisningen når alt er gjort */

.kol-navn.glitrer {
  background: linear-gradient(100deg,
    var(--f) 0%, var(--glitter) 42%, var(--mat) 55%, var(--f) 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: skimmer 5.5s ease-in-out infinite;
}
@keyframes skimmer {
  0%, 100% { background-position: 130% 0; }
  50%      { background-position: -30% 0; }
}

.kol-stjerner {
  margin-top: 5px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--tekst-dus);
}
.kol-stjerner.alle { color: var(--mat); }

@media (prefers-reduced-motion: reduce) {
  .orute, .orute .sym, .orute .hake { transition: none; }
  .konfetti { display: none; }
  .kol-navn.glitrer { animation: none; }
}

.helg-melding {
  grid-column: 3 / -1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; color: var(--tekst-dus);
}
.helg-melding strong {
  font-family: 'Anton', Impact, sans-serif; font-size: 36px;
  color: var(--tekst); text-transform: uppercase; letter-spacing: 0.03em;
}


/* ══════════════════════════════════════════════════════════
   SMAL SKJERM — telefon og iPad i portrett
   Samme kolonner som på storskjerm, men med lesbar bredde.
   Tidsaksen låses til venstre, resten sveiper du bortover.
   ══════════════════════════════════════════════════════════ */

@media (max-width: 899px) {
  .topp { flex-wrap: wrap; gap: 8px; padding: 10px 14px 8px; }
  .venstre { order: 1; }
  .hoyre { order: 2; margin-left: auto; gap: 12px; }
  .dagvalg { order: 3; width: 100%; }
  .dagvalg button { flex: 1; padding: 7px 0; }

  .dag { font-size: 22px; }
  .datorest { font-size: 12px; }
  .klokke { font-size: 24px; }
  .vaertopp { font-size: 12px; gap: 7px; }

  .rutenett {
    overflow-x: auto; overflow-y: hidden;
    scroll-padding-left: 44px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .rutenett::-webkit-scrollbar { display: none; }

  /* Tidsaksen blir stående mens resten sveipes */
  .rutenett > .kol:first-child {
    position: sticky; left: 0; z-index: 20;
    background: var(--ink);
    border-right: 1px solid var(--line);
  }

  .kol-navn { font-size: 16px; }
  .kol-under { font-size: 10px; letter-spacing: 0.1em; }
  .heldags span { font-size: 10px; }

  .p-tittel { font-size: 14px; }
  .post.spesiell .p-tittel { font-size: 15px; }
  .p-meta { font-size: 10.5px; }
  .post.smal .p-tittel { font-size: 12.5px; }

  .vt-a { font-size: 14px; }
  .vt-b { font-size: 11.5px; }

  .naa-linje .bjelke, .naa-linje .kule { left: 44px; }
  .naa-linje .etikett { width: 44px; font-size: 10.5px; }

  .husk { padding: 10px 14px; min-height: 46px; }
  .husk-merkelapp { font-size: 12px; }
  .husk-post { font-size: 14px; }
}

.varsel {
  position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);
  z-index: 60; max-width: 92vw;
  background: color-mix(in srgb, var(--naa) 22%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--naa) 45%, transparent);
  border-radius: 6px; padding: 9px 15px;
  font-size: 14px; font-weight: 500; text-align: center;
  color: var(--naa-tekst);
}
.varsel[hidden] { display: none; }
/* ══════════════════════════════════════════════════════════
   HØYDE PÅ SMAL SKJERM
   Hele dagen presset inn i telefonhøyde gir 25 px per time.
   Her får timen fast høyde, og tavla scrolles i begge retninger.
   Overskriftene låses øverst så du ser hvem sin kolonne du er i.
   ══════════════════════════════════════════════════════════ */

@media (max-width: 899px) {
  .rutenett { overflow-x: auto; overflow-y: auto; }

  .rutenett > .kol { grid-template-rows: auto var(--sporpx, 700px); }

  .kol-topp {
    position: sticky; top: 0; z-index: 15;
    background: var(--ink);
  }
  .rutenett > .kol:first-child .kol-topp { z-index: 25; }

  /* Værkolonnen fjernes. Hvert barn har allerede sitt eget vær i
     overskriften, og 78 px er mye på en telefon. */
  .vaerkol { display: none; }
  .rutenett {
    grid-template-columns: 44px repeat(var(--kolonner), minmax(168px, 1fr));
  }
  .helg-melding { grid-column: 2 / -1; }

  /* Værsammendraget øverst er også duplikat på smal skjerm */
  .vaertopp { display: none; }

  .topp { padding: 8px 13px 6px; gap: 6px; }
  .dagvalg button { padding: 5px 0; font-size: 11.5px; }
  .kol-topp { padding: 7px 9px 6px; }
  .kol-navn { font-size: 15px; }
  .kol-under { font-size: 9.5px; margin-top: 3px; }
  .kol-vaer { margin-top: 3px; font-size: 11px; }
  .kol-vaer .kv-temp { font-size: 12px; }

  /* La titler brytes i stedet for å kuttes midt i ordet */
  .post:not(.smal) .p-tittel { white-space: normal; }

  .akse .time { font-size: 12px; }
  .p-tittel { font-size: 15px; }
  .post.spesiell .p-tittel { font-size: 16.5px; }
  .p-meta { font-size: 11px; }
  .post.smal .p-tittel { font-size: 13.5px; }
}
</style>
</head>

<body>
<div class="tavle">
  <header class="topp">
    <div class="venstre">
      <span class="dag" id="ukedag">—</span>
      <span class="datorest" id="datorest">—</span>
    </div>

    <div class="dagvalg">
      <button id="knappIdag" class="aktiv">I dag</button>
      <button id="knappImorgen">I morgen</button>
      <button id="knappUke">Uke</button>
      <button id="knappOppgaver" class="stjerneknapp">⭐ Stjerner</button>
      <button id="knappFullskjerm" class="fullskjerm" title="Fullskjerm">⛶</button>
    </div>

    <div class="hoyre">
      <div class="vaertopp" id="vaertopp"><span>Henter vær</span></div>
      <div class="klokke" id="klokke">--:--</div>
    </div>
  </header>

  <main class="rutenett" id="rutenett"></main>
  <div class="uke" id="uke" hidden></div>
  <div class="stjerneside" id="stjerneside" hidden></div>

  <div class="stengtstripe" id="stengtstripe" hidden></div>
  <div class="varsel" id="varsel" hidden></div>

  <footer class="husk">
    <span class="husk-merkelapp" id="husklapp">Husk i dag</span>
    <div class="husk-liste" id="husk"></div>
  </footer>
</div>
<div class="status" id="status"></div>

<script>
const UKEDAGER = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const MAANEDER = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];

const tilDesimal = t => { const [h,m] = t.split(':').map(Number); return h + m/60; };

const finnBarn = id => id === 'familie'
  ? { id:'familie', navn: CONFIG.familie.navn, farge: CONFIG.familie.farge, undertekst:'' }
  : CONFIG.barn.find(b => b.id === id);

const posisjon = t => ((t - CONFIG.dagStart) / (CONFIG.dagSlutt - CONFIG.dagStart)) * 100;
const naaDesimal = () => { const n = new Date(); return n.getHours() + n.getMinutes()/60; };

const overlapper = (a, b) =>
  tilDesimal(a.start) < tilDesimal(b.slutt) && tilDesimal(b.start) < tilDesimal(a.slutt);

const datoNoekkel = d => `${d.getFullYear()}-`
  + `${String(d.getMonth() + 1).padStart(2, '0')}-`
  + `${String(d.getDate()).padStart(2, '0')}`;

function ukenummer(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dag = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dag);
  const start = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - start) / 86400000 + 1) / 7);
}

/* ══════════════════════════════════════════════════════════
   TEMA
   Byttet gjøres ved å skifte palett, ikke ved å dempe skjermen
   med et filter. Et filter gjør bildet grumsete; en egen palett
   holder kontrastene like gode i begge tilstander.
   ══════════════════════════════════════════════════════════ */

const KONFETTI_MORK = ['#F0A93C', '#E8674A', '#3FB8A5', '#9C8CE0', '#C9A227', '#EBF0F8'];
const KONFETTI_LYS  = ['#96610F', '#BC4426', '#127365', '#5A46AB', '#9C7407', '#2B6AB4'];

let temaValg = CONFIG.tema;      // 'lys', 'mork' eller 'auto'
let aktivtTema = null;

function onskerLys() {
  if (temaValg === 'lys') return true;
  if (temaValg === 'mork') return false;
  const t = new Date().getHours();
  return !(t >= CONFIG.nattFra || t < CONFIG.nattTil);
}

function settTema(force = false) {
  const lys = onskerLys();
  const nytt = lys ? 'lys' : 'mork';
  if (nytt === aktivtTema && !force) return false;

  aktivtTema = nytt;
  document.body.classList.toggle('lys', lys);

  CONFIG.barn.forEach(b => { b.farge = lys ? b.fargeLys : b.fargeMork; });
  CONFIG.familie.farge = lys ? CONFIG.familie.fargeLys : CONFIG.familie.fargeMork;

  const knapp = document.getElementById('knappTema');
  if (knapp) knapp.textContent = lys ? '\u263C' : '\u263E';
  return true;
}

/* Hvilken dag vises: 0 = i dag, 1 = i morgen */
let dagOffset = new Date().getHours() >= CONFIG.morgendagFra ? 1 : 0;

const valgtDato = (offset = dagOffset) => {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
};

// Ukedag som ISO-tall: mandag = 1, søndag = 7
const isoDag = d => d.getDay() === 0 ? 7 : d.getDay();


/* ══════════════════════════════════════════════════════════
   DATAKILDE
   ══════════════════════════════════════════════════════════ */

let kalenderFil = null;
let paaminnelserFil = null;
let aksFil = null;
let middagFil = null;
let stengtFil = null;
let manueltFil = null;
let kalenderFeil = null;

async function hentValgfri(navn) {
  try {
    const svar = await fetch(CONFIG.dataKilde + navn + '?v=' + Date.now());
    if (svar.ok) return await svar.json();
  } catch (e) { /* valgfri fil */ }
  return null;
}

async function hentKalenderfil() {
  try {
    const svar = await fetch(CONFIG.dataKilde + 'kalender.json?v=' + Date.now());
    if (svar.ok) { kalenderFil = await svar.json(); kalenderFeil = null; }
    else kalenderFeil = svar.status === 404
      ? 'Kjør workflowen i GitHub for å lage kalenderdataene'
      : `Fikk ikke kalender.json (${svar.status})`;
  } catch (e) {
    kalenderFeil = 'Får ikke kontakt med data-branchen';
  }

  aksFil          = await hentValgfri('aks.json');
  middagFil       = await hentValgfri('middager.json');
  stengtFil       = await hentValgfri('stengt.json');
  manueltFil      = await hentValgfri('manuelt.json');
  paaminnelserFil = await hentValgfri('paaminnelser.json');
}

function byggDag(offset = dagOffset) {
  const dato = valgtDato(offset);
  const noekkel = datoNoekkel(dato);
  const ukedag = dato.getDay();
  const uke = ukenummer(dato);
  const alleBarn = [...CONFIG.barn.map(b => b.id), 'familie'];

  const fraFil = kalenderFil?.dager?.[noekkel] || [];
  const manuelle = (manueltFil?.hendelser || []).filter(h => h.dato === noekkel);

  const dagens  = [...fraFil.filter(p => !p.heldags && p.type !== 'husk'), ...manuelle];
  const heldags = fraFil.filter(p => p.heldags);
  const husk    = [
    ...fraFil.filter(p => p.type === 'husk').map(p => ({ barn: p.barn, tekst: p.tittel })),
    ...(manueltFil?.husk || []).filter(h => h.dato === noekkel),
    ...(paaminnelserFil?.dager?.[noekkel]?.paaminnelser || [])
  ];

  const rammer = [];
  let poster = [];

  alleBarn.forEach(id => {
    (RAMMER[id]?.[ukedag] || []).forEach(r => rammer.push({ ...r, barn: id }));

    const fag = (FAGPLAN[id]?.[ukedag] || [])
      .map(f => ({ ...f, type: f.viktig ? 'spesiell' : 'okt' }));

    const aksUke = aksFil?.[String(uke)]?.[String(ukedag)] || [];
    const aksIdag = (id === 'sofia' ? aksUke : [])
      .filter(Boolean)
      .map((tittel, i) => ({
        tittel,
        start: CONFIG.aksTider[i]?.[0],
        slutt: CONFIG.aksTider[i]?.[1],
        type: 'okt'
      }))
      .filter(a => a.start);

    const faste = [...fag, ...aksIdag, ...(RUTINER[id] || [])]
      .map(p => ({ ...p, barn: id, kilde: 'fast' }));

    const dagensForBarn = dagens.filter(d => d.barn === id);
    const beholdt = faste.filter(f => !dagensForBarn.some(d => overlapper(f, d)));

    poster = poster.concat(beholdt, dagensForBarn);
  });

  poster.filter(p => p.tittel === 'Gym').forEach(p => {
    if (!husk.some(h => h.tekst === 'Gymtøy')) husk.unshift({ barn: p.barn, tekst: 'Gymtøy' });
  });

  // Middagen ligger i familiekolonnen
  const middag = middagFil?.[String(uke)]?.[String(isoDag(dato))];
  if (middag?.rett) {
    poster.push({
      barn: 'familie',
      tittel: 'Middag: ' + middag.rett,
      sted: middag.tid || '',
      start: CONFIG.middagTid[0],
      slutt: CONFIG.middagTid[1],
      type: 'mat',
      kilde: 'middag'
    });
  }

  return { rammer, poster, heldags, husk, dato, noekkel, uke, ukedag,
           aksMangler: ukedag >= 1 && ukedag <= 5
             && !(aksFil?.[String(uke)]?.[String(ukedag)] || []).filter(Boolean).length };
}

const VAERKODER = {
  0:'Klart',1:'Lettskyet',2:'Delvis skyet',3:'Skyet',45:'Tåke',48:'Tåke',
  51:'Yr',53:'Yr',55:'Yr',61:'Regn',63:'Regn',65:'Kraftig regn',
  66:'Sludd',67:'Sludd',71:'Snø',73:'Snø',75:'Mye snø',77:'Snø',
  80:'Regnbyger',81:'Regnbyger',82:'Kraftige byger',85:'Snøbyger',86:'Snøbyger',
  95:'Torden',96:'Torden',99:'Torden'
};

const VAERIKON = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌦️',56:'🌧️',57:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',66:'🌨️',67:'🌨️',
  71:'❄️',73:'❄️',75:'❄️',77:'❄️',
  80:'🌦️',81:'🌦️',82:'⛈️',85:'🌨️',86:'🌨️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};

const ikon = kode => VAERIKON[kode] || '';

let vaerData = null;

async function hentVaer() {
  const lat = CONFIG.steder.map(s => s.lat).join(',');
  const lon = CONFIG.steder.map(s => s.lon).join(',');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    + `&current=temperature_2m,apparent_temperature,weather_code`
    + `&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code`
    + `&timezone=Europe%2FOslo&forecast_days=3`;

  try {
    const svar = await (await fetch(url)).json();
    const liste = Array.isArray(svar) ? svar : [svar];

    vaerData = liste.map((d, i) => ({
      sted: CONFIG.steder[i],
      naa: d.current,
      timer: d.hourly.time.map((t, j) => ({
        tid: t,
        temp: d.hourly.temperature_2m[j],
        foles: d.hourly.apparent_temperature[j],
        mm: d.hourly.precipitation[j],
        sannsyn: d.hourly.precipitation_probability[j],
        kode: d.hourly.weather_code[j]
      }))
    }));
  } catch (e) {
    console.warn('Klarte ikke hente vær.', e);
    vaerData = null;
  }
  tegnVaertopp();
}

const timerForDag = (sted, noekkel) =>
  (sted?.timer || []).filter(t => t.tid.startsWith(noekkel));

/* Sammendrag for ett sted på én dag, avgrenset til timene
   barna faktisk er ute av huset. */
function dagsvaer(stedIndeks, noekkel) {
  if (!vaerData?.[stedIndeks]) return null;
  const timer = timerForDag(vaerData[stedIndeks], noekkel)
    .filter(t => {
      const h = +t.tid.slice(11, 13);
      return h >= CONFIG.vaerFra && h <= CONFIG.vaerTil;
    });
  if (!timer.length) return null;

  const mm = timer.reduce((s, t) => s + (t.mm || 0), 0);

  /* Hvilket symbol representerer dagen: kommer det nedbør, er den
     våteste timen mest verdt å vite om. Ellers det som varer lengst. */
  let kode;
  if (mm >= 0.2) {
    kode = timer.reduce((a, b) => (b.mm || 0) > (a.mm || 0) ? b : a).kode;
  } else {
    const tell = new Map();
    timer.forEach(t => tell.set(t.kode, (tell.get(t.kode) || 0) + 1));
    kode = [...tell.entries()].sort((a, b) => b[1] - a[1])[0][0];
  }

  return {
    min: Math.round(Math.min(...timer.map(t => t.temp))),
    maks: Math.round(Math.max(...timer.map(t => t.temp))),
    folesMin: Math.round(Math.min(...timer.map(t => t.foles ?? t.temp))),
    folesMaks: Math.round(Math.max(...timer.map(t => t.foles ?? t.temp))),
    mm,
    sannsyn: Math.max(...timer.map(t => t.sannsyn || 0)),
    kode
  };
}

/* Vises bare når den avviker nok til å endre hva man tar på seg.
   Ellers står det to tall som sier det samme, overalt. */
const FOLES_GRENSE = 3;

function tegnVaertopp() {
  const boks = document.getElementById('vaertopp');
  if (!vaerData?.length) { boks.innerHTML = '<span>Vær utilgjengelig</span>'; return; }

  const noekkel = datoNoekkel(valgtDato());
  const timer = timerForDag(vaerData[0], noekkel)
    .filter(t => { const h = +t.tid.slice(11,13); return h >= CONFIG.vaerFra && h <= CONFIG.vaerTil; });

  if (!timer.length) { boks.innerHTML = '<span>Ingen varsel</span>'; return; }

  const min = Math.round(Math.min(...timer.map(t => t.temp)));
  const maks = Math.round(Math.max(...timer.map(t => t.temp)));
  const mm = timer.reduce((s, t) => s + (t.mm || 0), 0);
  const sannsyn = Math.max(...timer.map(t => t.sannsyn || 0));

  let start = '';
  if (dagOffset === 0) {
    const k = vaerData[0].naa.weather_code;
    const t = Math.round(vaerData[0].naa.temperature_2m);
    const f = Math.round(vaerData[0].naa.apparent_temperature ?? vaerData[0].naa.temperature_2m);
    start = `<span class="vt-ikon">${ikon(k)}</span>`
          + `<span class="grader">${t}°</span>`
          + (Math.abs(f - t) >= FOLES_GRENSE ? `<span class="foles">føles ${f}°</span>` : '')
          + `<span>${VAERKODER[k] || ''}</span>`;
  } else {
    const midt = timer[Math.floor(timer.length / 2)];
    start = `<span class="vt-ikon">${ikon(midt.kode)}</span>`
          + `<span class="grader">${Math.round(midt.temp)}°</span>`
          + `<span>${VAERKODER[midt.kode] || ''}</span>`;
  }

  boks.innerHTML = start
    + `<span>${min}° / ${maks}°</span>`
    + (mm >= 0.2
        ? `<span class="vaat">${mm.toFixed(1)} mm · ${sannsyn}%</span>`
        : `<span>Tørt</span>`);
}

function lagVaerkolonne(noekkel) {
  const kol = document.createElement('div');
  kol.className = 'kol vaerkol';

  const merker = CONFIG.steder.map(s => `<span>${s.kort}</span>`).join('');
  kol.innerHTML = `
    <div class="kol-topp">
      <div class="kol-navn">Vær</div>
      <div class="vaer-merker">${merker}</div>
    </div>
    <div class="spor"></div>`;

  const spor = kol.querySelector('.spor');
  if (!vaerData?.length) return kol;

  const a = timerForDag(vaerData[0], noekkel);
  const b = timerForDag(vaerData[1], noekkel);
  if (!a.length) return kol;

  let forrigeKode = null;

  for (let t = Math.floor(CONFIG.dagStart); t < Math.ceil(CONFIG.dagSlutt); t++) {
    const ta = a.find(x => +x.tid.slice(11,13) === t);
    if (!ta) continue;
    const tb = b.find(x => +x.tid.slice(11,13) === t);

    const topp = posisjon(t);
    const bunn = posisjon(t + 1);

    const rad = document.createElement('div');
    rad.className = 'vaertime';
    rad.style.top = topp + '%';
    rad.style.height = (bunn - topp) + '%';

    // Nedbør tegnes som en stigende vannstand i timen
    const mm = ta.mm || 0;
    const fyll = Math.min(mm / 2, 1);      // 2 mm i timen fyller hele
    const alfa = mm > 0 ? 0.18 + fyll * 0.45 : 0;

    /* Symbol bare når været faktisk skifter. Ett per time blir en
       vegg av skyer; ett ved skiftet er det du trenger å se. */
    const skifte = ta.kode !== forrigeKode;
    forrigeKode = ta.kode;

    rad.innerHTML = `
      ${mm > 0 ? `<div class="vaat-fyll" style="height:${Math.max(fyll * 100, 12)}%;opacity:${alfa}"></div>` : ''}
      ${skifte ? `<span class="vt-ikon-time">${ikon(ta.kode)}</span>` : ''}
      <span class="vt-a">${Math.round(ta.temp)}°</span>
      <span class="vt-b">${tb ? Math.round(tb.temp) + '°' : ''}</span>
      ${mm >= 0.2 ? `<span class="vt-mm">${mm.toFixed(1)}</span>` : ''}`;

    spor.appendChild(rad);
  }

  return kol;
}

let sisteData = null;
let naaVist = false;

function tegnRutenett(data) {
  const rutenett = document.getElementById('rutenett');
  const kolonner = [...CONFIG.barn.map(b => b.id), 'familie'];
  rutenett.style.setProperty('--kolonner', kolonner.length);
  rutenett.style.setProperty('--sporpx',
    Math.round((CONFIG.dagSlutt - CONFIG.dagStart) * CONFIG.pxPerTimeSmal) + 'px');
  rutenett.innerHTML = '';

  const akseKol = document.createElement('div');
  akseKol.className = 'kol';
  akseKol.innerHTML = '<div class="kol-topp">&nbsp;</div><div class="akse" id="akse"></div>';
  rutenett.appendChild(akseKol);

  rutenett.appendChild(lagVaerkolonne(data.noekkel));

  if (!data.poster.length && !data.heldags.length) {
    const m = document.createElement('div');
    m.className = 'helg-melding';
    m.innerHTML = '<strong>Fri</strong><span>Ingenting er planlagt</span>';
    rutenett.appendChild(m);
    tegnTidsakse();
    return;
  }

  kolonner.forEach(id => {
    const barn = finnBarn(id);
    const kol = document.createElement('div');
    kol.className = 'kol';
    kol.style.setProperty('--f', barn.farge);

    const heldags = data.heldags.filter(h => h.barn === id);

    kol.innerHTML = `
      <div class="kol-topp">
        <div class="kol-navn ${alleGjort(barn, data.noekkel) ? 'glitrer' : ''}">${barn.navn}</div>
        ${barn.undertekst ? `<div class="kol-under">${barn.undertekst}</div>` : ''}
        ${kolonneVaer(barn, data.noekkel)}
        ${kolonneStjerner(barn, data.noekkel)}
        ${id === 'sofia' && data.aksMangler
          ? `<div class="mangler">AKS-plan mangler for uke ${data.uke}</div>` : ''}
        ${heldags.length ? `<div class="heldags">${heldags.map(h => `<span class="${h.stengt ? 'stengt' : ''}">${h.tittel}</span>`).join('')}</div>` : ''}
      </div>
      <div class="spor"></div>`;

    const spor = kol.querySelector('.spor');

    for (let t = Math.ceil(CONFIG.dagStart); t <= Math.floor(CONFIG.dagSlutt); t++) {
      const s = document.createElement('div');
      s.className = 'strek';
      s.style.top = posisjon(t) + '%';
      spor.appendChild(s);
    }

    data.rammer.filter(r => r.barn === id).forEach(r => spor.appendChild(lagRamme(r)));
    data.poster.filter(p => p.barn === id).forEach(p => spor.appendChild(lagPost(p)));

    rutenett.appendChild(kol);
  });

  tegnTidsakse();
  tegnNaaLinje();
}

function kolonneVaer(barn, noekkel) {
  if (barn.vaersted === undefined) return '';
  const v = dagsvaer(barn.vaersted, noekkel);
  if (!v) return '';

  const sted = CONFIG.steder[barn.vaersted];
  const vaatt = v.mm >= 0.2;

  // Kaldeste følte time er det som avgjør påkledningen
  const avvik = v.folesMin - v.min;
  const visFoles = Math.abs(avvik) >= FOLES_GRENSE;

  return `<div class="kol-vaer">
    <span class="kv-ikon">${ikon(v.kode)}</span>
    <span class="kv-sted">${sted.kort}</span>
    <span class="kv-temp">${v.min}–${v.maks}°</span>
    ${visFoles ? `<span class="kv-foles">føles ${v.folesMin}°</span>` : ''}
    ${vaatt ? `<span class="kv-vaat">${v.mm.toFixed(1)} mm</span>` : ''}
  </div>`;
}

function lagRamme(r) {
  const start = Math.max(tilDesimal(r.start), CONFIG.dagStart);
  const slutt = Math.min(tilDesimal(r.slutt), CONFIG.dagSlutt);
  const el = document.createElement('div');
  el.className = 'ramme';
  el.style.top = posisjon(start) + '%';
  el.style.height = (posisjon(slutt) - posisjon(start)) + '%';
  el.innerHTML = `<span class="r-navn">${r.tittel}</span>`;
  return el;
}

function lagPost(p) {
  const start = Math.max(tilDesimal(p.start), CONFIG.dagStart);
  const slutt = Math.min(tilDesimal(p.slutt), CONFIG.dagSlutt);
  const hoyde = posisjon(slutt) - posisjon(start);

  const el = document.createElement('div');
  el.className = 'post ' + (p.type || 'okt');
  el.dataset.start = start;
  el.dataset.slutt = slutt;
  el.style.top = posisjon(start) + '%';
  el.style.height = hoyde + '%';
  if (hoyde < 4) el.classList.add('smal');

  const tid = `${p.start}–${p.slutt}`;
  const meta = p.sted ? `${tid} · ${p.sted}` : tid;

  el.innerHTML = `
    <div class="p-tittel">${p.tittel}</div>
    <div class="p-meta">${meta}</div>
    ${p.kilde === 'mykid' ? '<div class="merke"></div>' : ''}`;

  return el;
}

function tegnTidsakse() {
  const akse = document.getElementById('akse');
  if (!akse) return;
  akse.innerHTML = '';
  for (let t = Math.ceil(CONFIG.dagStart); t <= Math.floor(CONFIG.dagSlutt); t++) {
    const el = document.createElement('div');
    el.className = 'time';
    el.style.top = posisjon(t) + '%';
    el.textContent = String(t).padStart(2,'0') + ':00';
    akse.appendChild(el);
  }
}

function tegnNaaLinje() {
  document.querySelector('.naa-linje')?.remove();
  if (dagOffset !== 0) return;

  const naa = naaDesimal();
  if (naa < CONFIG.dagStart || naa > CONFIG.dagSlutt) return;

  const rutenett = document.getElementById('rutenett');

  /* Må måle mot en synlig kolonne. Værkolonnen er skjult på telefon,
     og et skjult element er null piksler høyt. */
  const spor = document.querySelector('.kol:not(.vaerkol) .spor');
  if (!spor || !spor.offsetHeight) return;

  const kol = spor.parentElement;
  const topp = kol.offsetTop + spor.offsetTop + spor.offsetHeight * (posisjon(naa) / 100);

  const n = new Date();
  const klokke = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;

  const linje = document.createElement('div');
  linje.className = 'naa-linje';
  linje.style.top = topp + 'px';
  // Strekken skal nå tvers over alle kolonnene, også de som er scrollet vekk
  linje.style.width = rutenett.scrollWidth + 'px';
  linje.style.right = 'auto';
  linje.innerHTML = `<div class="etikett">${klokke}</div><div class="bjelke"></div><div class="kule"></div>`;
  rutenett.appendChild(linje);

  // Første gang: rull slik at nåtiden er synlig
  if (!naaVist && rutenett.scrollHeight > rutenett.clientHeight) {
    rutenett.scrollTop = Math.max(0, topp - rutenett.clientHeight / 2);
    naaVist = true;
  }

  document.querySelectorAll('.post').forEach(el => {
    const s = parseFloat(el.dataset.start), sl = parseFloat(el.dataset.slutt);
    el.classList.toggle('ferdig', sl < naa);
    el.classList.toggle('paagaar', s <= naa && naa < sl);
  });
}

function tegnHusk(husk) {
  const boks = document.getElementById('husk');
  document.getElementById('husklapp').textContent = dagOffset === 0 ? 'Husk i dag' : 'Husk i morgen';
  if (!husk.length) { boks.innerHTML = '<span class="husk-tom">Ingenting spesielt</span>'; return; }
  boks.innerHTML = husk.map(h => {
    const b = finnBarn(h.barn);
    const ai = h.kilde === 'ai' ? ' ai' : '';
    return `<div class="husk-post${ai}" style="--f:${b.farge}"><i></i><span>${h.tekst}</span></div>`;
  }).join('');
}

function tegnDato() {
  if (visning === 'uke') {
    const start = mandagIUka(ukeOffset);
    const slutt = new Date(start); slutt.setDate(slutt.getDate() + 6);
    document.getElementById('ukedag').textContent = `Uke ${ukenummer(start)}`;
    document.getElementById('datorest').textContent =
      `${start.getDate()}. ${MAANEDER[start.getMonth()].slice(0,3)} – ${slutt.getDate()}. ${MAANEDER[slutt.getMonth()].slice(0,3)}`;
  } else {
    const d = valgtDato();
    document.getElementById('ukedag').textContent = UKEDAGER[d.getDay()];
    document.getElementById('datorest').textContent =
      `${d.getDate()}. ${MAANEDER[d.getMonth()]} · Uke ${ukenummer(d)}`;
  }
  document.getElementById('knappIdag').classList.toggle('aktiv', visning === 'dag' && dagOffset === 0);
  document.getElementById('knappImorgen').classList.toggle('aktiv', visning === 'dag' && dagOffset === 1);
  document.getElementById('knappUke').classList.toggle('aktiv', visning === 'uke');
}

let sisteDatoNokkel = null;

function oppdaterKlokke() {
  const n = new Date();
  document.getElementById('klokke').textContent =
    `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;

  if (settTema() && sisteData) tegnAlt();

  const noekkel = n.toDateString();
  if (sisteDatoNokkel && sisteDatoNokkel !== noekkel) {
    dagOffset = 0;
    last();
  }
  sisteDatoNokkel = noekkel;

  if (sisteData) tegnNaaLinje();
}

/* ══════════════════════════════════════════════════════════
   UKESVISNING
   Bare det som skiller dagene fra hverandre. Norsk fem dager
   på rad er ikke informasjon.
   ══════════════════════════════════════════════════════════ */

function mandagIUka(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() - (isoDag(d) - 1) + offset * 7);
  d.setHours(0, 0, 0, 0);
  return d;
}

let ukeOffset = 0;

function verdtAaVise(p) {
  if (p.type === 'rutine') return false;
  if (p.kilde === 'middag') return false;          // egen rad
  if (p.type === 'mat') return false;              // måltider i barnehagen
  if (p.type === 'spesiell') return true;
  return p.kilde === 'fast' && p.barn === 'sofia' && p.start >= '13:30'; // AKS
}

function tegnUke() {
  const boks = document.getElementById('uke');
  const start = mandagIUka(ukeOffset);
  const idagN = datoNoekkel(new Date());

  const dager = [...Array(7)].map((_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const diff = Math.round((d - new Date(new Date().setHours(0,0,0,0))) / 86400000);
    return { dato: d, noekkel: datoNoekkel(d), data: byggDag(diff) };
  });

  const KORT = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];

  let html = '<div class="uke-hjorne uke-hode"></div>';

  dager.forEach((dag, i) => {
    const erIdag = dag.noekkel === idagN;
    const helg = i >= 5;
    html += `<div class="uke-hode ${erIdag ? 'idag' : ''} ${helg ? 'helg' : ''}">
      <div class="ud">${KORT[i]}</div>
      <div class="ud-dato">${dag.dato.getDate()}. ${MAANEDER[dag.dato.getMonth()].slice(0,3)}</div>
    </div>`;
  });

  [...CONFIG.barn, { id: 'familie', navn: CONFIG.familie.navn, farge: CONFIG.familie.farge }]
    .forEach(barn => {
      html += `<div class="uke-navn" style="--f:${barn.farge}">${barn.navn}</div>`;

      dager.forEach(dag => {
        const heldags = dag.data.heldags.filter(h => h.barn === barn.id);
        const poster = dag.data.poster.filter(p => p.barn === barn.id && verdtAaVise(p));

        const innhold =
          heldags.map(h =>
            `<div class="ue ${h.stengt ? 'stengt' : ''}" style="--f:${barn.farge}">${h.tittel}</div>`).join('')
          + poster.map(p =>
            `<div class="ue" style="--f:${barn.farge}">${p.tittel}<small>${p.start}</small></div>`).join('');

        html += `<div class="uke-celle">${innhold}</div>`;
      });
    });

  // Middagsraden
  html += `<div class="uke-navn uke-rad-middag" style="--f:var(--mat)">Middag</div>`;
  dager.forEach(dag => {
    const uke = ukenummer(dag.dato);
    const m = middagFil?.[String(uke)]?.[String(isoDag(dag.dato))];
    html += `<div class="uke-celle">${
      m?.rett
        ? `<div class="ue middag">${m.rett}${m.tid ? `<small>${m.tid}</small>` : ''}${m.notat ? `<small>${m.notat}</small>` : ''}</div>`
        : ''
    }</div>`;
  });

  boks.innerHTML = html;
}


/* ── Varsel om stengte dager ── */

function tegnStengtvarsel() {
  const stripe = document.getElementById('stengtstripe');
  const idag = new Date(new Date().setHours(0, 0, 0, 0));

  const kommende = (stengtFil?.dager || [])
    .map(s => {
      const [aa, mm, dd] = s.dato.split('-').map(Number);
      const d = new Date(aa, mm - 1, dd);
      return { ...s, d, dager: Math.round((d - idag) / 86400000) };
    })
    .filter(s => s.dager >= 0 && s.dager <= CONFIG.stengtVarselDager)
    .sort((a, b) => a.dager - b.dager);

  if (!kommende.length) { stripe.hidden = true; return; }

  const s = kommende[0];
  const naar = s.dager === 0 ? 'i dag'
             : s.dager === 1 ? 'i morgen'
             : `om ${s.dager} dager`;

  stripe.innerHTML = `<b>Stengt</b><span>Barnehagen er stengt `
    + `${UKEDAGER[s.d.getDay()].toLowerCase()} ${s.d.getDate()}. ${MAANEDER[s.d.getMonth()]} — ${naar}</span>`;
  stripe.hidden = false;
}


/* ══════════════════════════════════════════════════════════
   STJERNER
   Supabase er fasit, lokal lagring er reservelag. Et trykk
   virker med én gang selv om nettet henger, og synkes etterpå.
   ══════════════════════════════════════════════════════════ */

const LAGERNOEKKEL = 'familietavla-stjerner';
let stjerner = {};          // { dato: { barnId: [oppgaveId] } }
let brukt = {};             // { barnId: antall innløste }
let lagringVirker = true;
let skyVirker = null;

const skyPaa = () => !!(CONFIG.supabase.url && CONFIG.supabase.anonKey);

const skyHoder = () => ({
  'apikey': CONFIG.supabase.anonKey,
  'Authorization': `Bearer ${CONFIG.supabase.anonKey}`,
  'Content-Type': 'application/json'
});

function lesLokalt() {
  try {
    const lagret = JSON.parse(localStorage.getItem(LAGERNOEKKEL) || '{}');
    stjerner = lagret.stjerner || {};
    brukt = lagret.brukt || {};
    lagringVirker = true;
  } catch (e) {
    stjerner = {}; brukt = {};
    lagringVirker = false;
  }
}

function skrivLokalt() {
  try { localStorage.setItem(LAGERNOEKKEL, JSON.stringify({ stjerner, brukt })); }
  catch (e) { lagringVirker = false; }
}

/* Henter hele historikken. Tre barn med tre oppgaver gir rundt
   3000 rader i året — små nok til at det ikke er verdt å paginere. */
async function hentStjernerFraSky() {
  if (!skyPaa()) { skyVirker = false; return; }
  const familie = encodeURIComponent(CONFIG.supabase.familie);

  try {
    const [rStjerner, rBruk] = await Promise.all([
      fetch(`${CONFIG.supabase.url}/rest/v1/stjerner`
        + `?familie=eq.${familie}&gjort=is.true&select=dato,barn,oppgave`,
        { headers: skyHoder() }),
      fetch(`${CONFIG.supabase.url}/rest/v1/stjernebruk`
        + `?familie=eq.${familie}&select=barn,antall`,
        { headers: skyHoder() })
    ]);
    if (!rStjerner.ok) throw new Error(rStjerner.status);

    const rader = await rStjerner.json();
    stjerner = {};
    rader.forEach(r => {
      if (!stjerner[r.dato]) stjerner[r.dato] = {};
      if (!stjerner[r.dato][r.barn]) stjerner[r.dato][r.barn] = [];
      if (!stjerner[r.dato][r.barn].includes(r.oppgave)) {
        stjerner[r.dato][r.barn].push(r.oppgave);
      }
    });

    brukt = {};
    if (rBruk.ok) {
      (await rBruk.json()).forEach(b => {
        brukt[b.barn] = (brukt[b.barn] || 0) + b.antall;
      });
    }

    skrivLokalt();
    skyVirker = true;
  } catch (e) {
    skyVirker = false;
  }
}

async function lagreTilSky(barnId, oppgaveId, noekkel, gjort) {
  if (!skyPaa()) return;
  try {
    const svar = await fetch(
      `${CONFIG.supabase.url}/rest/v1/stjerner?on_conflict=familie,dato,barn,oppgave`,
      {
        method: 'POST',
        headers: { ...skyHoder(), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify({
          familie: CONFIG.supabase.familie,
          dato: noekkel, barn: barnId, oppgave: oppgaveId,
          gjort, oppdatert: new Date().toISOString()
        })
      });
    skyVirker = svar.ok;
  } catch (e) { skyVirker = false; }
}

async function lagreBruk(barnId, antall, notat) {
  brukt[barnId] = (brukt[barnId] || 0) + antall;
  skrivLokalt();
  if (!skyPaa()) return;
  try {
    await fetch(`${CONFIG.supabase.url}/rest/v1/stjernebruk`, {
      method: 'POST',
      headers: { ...skyHoder(), 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        familie: CONFIG.supabase.familie, barn: barnId, antall, notat: notat || null
      })
    });
  } catch (e) { skyVirker = false; }
}

const gjortIDag = (barnId, noekkel) => stjerner[noekkel]?.[barnId] || [];

function vipp(barnId, oppgaveId, noekkel) {
  if (!stjerner[noekkel]) stjerner[noekkel] = {};
  const liste = stjerner[noekkel][barnId] || [];
  const gjort = !liste.includes(oppgaveId);

  stjerner[noekkel][barnId] = gjort
    ? [...liste, oppgaveId]
    : liste.filter(x => x !== oppgaveId);

  skrivLokalt();
  lagreTilSky(barnId, oppgaveId, noekkel, gjort);
  return gjort;
}

function ukesStjerner(barnId, offset = 0) {
  const start = mandagIUka(offset);
  let sum = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    sum += gjortIDag(barnId, datoNoekkel(d)).length;
  }
  return sum;
}

/* Oppspart: alt opptjent minus alt innløst */
function bank(barnId) {
  let sum = 0;
  for (const dag of Object.values(stjerner)) sum += (dag[barnId] || []).length;
  return sum - (brukt[barnId] || 0);
}

/* Å vise "rydde tallerken" klokka åtte om morgenen inviterer til juks */
function erAktuell(oppgave) {
  const t = new Date().getHours();
  if (oppgave.naar === 'hjem') return t >= CONFIG.hjemFra;
  if (oppgave.naar === 'middag') return t >= CONFIG.middagFra;
  return true;
}

/* Alle oppgavekolonnene som finnes, i rekkefølge */
function oppgaveKolonner() {
  const sett = [];
  Object.values(CONFIG.oppgaver).flat().forEach(o => {
    if (!sett.some(x => x.id === o.id)) sett.push(o);
  });
  return sett;
}

/* ── Konfetti ── */

function konfetti(vert) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const boks = document.createElement('div');
  boks.className = 'konfetti';

  for (let i = 0; i < 22; i++) {
    const bit = document.createElement('i');
    const vinkel = (Math.PI * 2 * i) / 22 + Math.random() * 0.5;
    const lengde = 55 + Math.random() * 65;
    bit.style.setProperty('--dx', Math.cos(vinkel) * lengde + 'px');
    bit.style.setProperty('--dy', Math.sin(vinkel) * lengde + 'px');
    bit.style.setProperty('--rot', Math.round(Math.random() * 720 - 360) + 'deg');
    const farger = aktivtTema === 'lys' ? KONFETTI_LYS : KONFETTI_MORK;
    bit.style.background = farger[i % farger.length];
    bit.style.animationDelay = (Math.random() * 0.08).toFixed(2) + 's';
    boks.appendChild(bit);
  }

  vert.appendChild(boks);
  setTimeout(() => boks.remove(), 1300);
}

/* ── Tegning av stjernesiden ── */

function tegnStjerneside() {
  const side = document.getElementById('stjerneside');
  const noekkel = datoNoekkel(new Date());
  const kolonner = oppgaveKolonner();
  const medOppgaver = CONFIG.barn.filter(b => (CONFIG.oppgaver[b.id] || []).length);

  let html = `<div class="ss-topp">
      <button class="ss-tilbake" id="ssTilbake"><span class="pil">←</span> Tilbake</button>
      <span class="ss-tittel">Stjerner</span>
    </div>`;

  if (!lagringVirker && !skyVirker) {
    html += `<div class="ss-melding">Stjernene kan ikke lagres her.
      Åpne tavla i Safari eller Chrome i stedet for i en innebygd visning.</div>`;
    side.innerHTML = html;
    document.getElementById('ssTilbake').addEventListener('click', tilbakeFraStjerner);
    return;
  }

  // Rutenettet
  html += `<div class="ss-rutenett" style="--oppgaver:${kolonner.length}">`;
  html += `<div></div>`;
  kolonner.forEach(o => {
    html += `<div class="ss-hodecelle"><span class="he">${o.emoji}</span>
      <span class="ht">${o.tekst}</span></div>`;
  });

  medOppgaver.forEach(barn => {
    const mine = CONFIG.oppgaver[barn.id].map(o => o.id);
    const gjort = gjortIDag(barn.id, noekkel);

    html += `<div class="ss-navncelle" style="--f:${barn.farge}">
      <span class="ss-navn">${barn.navn}</span>
      <span class="ss-bank" data-bank="${barn.id}"><b>${bank(barn.id)}</b> oppsparte</span>
    </div>`;

    kolonner.forEach(o => {
      if (!mine.includes(o.id)) { html += `<div></div>`; return; }
      const erGjort = gjort.includes(o.id);
      const senere = !erGjort && !erAktuell(o);
      html += `<div class="orute ${erGjort ? 'gjort' : ''} ${senere ? 'senere' : ''}"
                 style="--f:${barn.farge}"
                 data-barn="${barn.id}" data-oppgave="${o.id}">
          <span class="sym">${o.emoji}</span>
          <span class="hake">⭐</span>
        </div>`;
    });
  });
  html += `</div>`;

  // Ukesoversikt
  const start = mandagIUka(0);
  const KORT = ['M','Ti','O','To','F','L','S'];
  html += `<div class="ss-uke"><h3>Denne uka</h3><div class="ss-uketabell">`;
  html += `<div></div>`;
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    const erIdag = datoNoekkel(d) === noekkel;
    html += `<div class="ss-ukehode ${erIdag ? 'idag' : ''}">${KORT[i]}</div>`;
  }
  html += `<div class="ss-ukehode">Sum</div>`;

  medOppgaver.forEach(barn => {
    const maal = CONFIG.oppgaver[barn.id].length;
    html += `<div class="ss-ukenavn" style="--f:${barn.farge}">${barn.navn}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      const n = gjortIDag(barn.id, datoNoekkel(d)).length;
      const klasse = n === 0 ? '' : (n >= maal ? 'full' : 'noe');
      html += `<div class="ss-dag ${klasse}" style="--f:${barn.farge}">${n || ''}</div>`;
    }
    html += `<div class="ss-sum">${ukesStjerner(barn.id)}</div>`;
  });
  html += `</div>`;

  if (skyPaa() && skyVirker === false) {
    html += `<div class="ss-melding">Lagret bare på denne skjermen — får ikke kontakt med Supabase</div>`;
  }
  html += `</div>`;

  side.innerHTML = html;

  document.getElementById('ssTilbake').addEventListener('click', tilbakeFraStjerner);

  side.querySelectorAll('.orute').forEach(rute => {
    rute.addEventListener('click', () => {
      const ble = vipp(rute.dataset.barn, rute.dataset.oppgave, noekkel);
      rute.classList.toggle('gjort', ble);
      rute.classList.remove('senere');
      if (ble) konfetti(rute);          // feires bare oppover
      oppdaterTall();
    });
  });

  // Langt trykk på tallet løser inn stjerner. Voksne finner det, barn ikke.
  side.querySelectorAll('.ss-bank').forEach(el => {
    let timer = null;
    const start = () => {
      timer = setTimeout(() => {
        timer = null;
        losInn(el.dataset.bank);
      }, 650);
    };
    const stopp = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(h => el.addEventListener(h, stopp));
  });
}

/* Oppdaterer tall uten å tegne hele siden på nytt, så konfettien
   ikke blir revet bort midt i animasjonen. */
function oppdaterTall() {
  const noekkel = datoNoekkel(new Date());
  const start = mandagIUka(0);

  document.querySelectorAll('.ss-bank').forEach(el => {
    el.querySelector('b').textContent = bank(el.dataset.bank);
  });

  const side = document.getElementById('stjerneside');
  const rader = side.querySelectorAll('.ss-ukenavn');
  rader.forEach((navnEl, r) => {
    const barn = CONFIG.barn.filter(b => (CONFIG.oppgaver[b.id] || []).length)[r];
    if (!barn) return;
    const maal = CONFIG.oppgaver[barn.id].length;
    let el = navnEl.nextElementSibling;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      const n = gjortIDag(barn.id, datoNoekkel(d)).length;
      el.textContent = n || '';
      el.className = 'ss-dag ' + (n === 0 ? '' : (n >= maal ? 'full' : 'noe'));
      el = el.nextElementSibling;
    }
    el.textContent = ukesStjerner(barn.id);
  });
}

function losInn(barnId) {
  const barn = finnBarn(barnId);
  const tilgjengelig = bank(barnId);
  const svar = prompt(
    `Løs inn stjerner for ${barn.navn}.\nOppsparte: ${tilgjengelig}\n\nHvor mange skal brukes?`, '');
  if (svar === null) return;
  const antall = parseInt(svar, 10);
  if (!Number.isFinite(antall) || antall <= 0) return;
  if (antall > tilgjengelig) { alert(`${barn.navn} har bare ${tilgjengelig} stjerner.`); return; }
  lagreBruk(barnId, antall, null);
  oppdaterTall();
}

/* Stjernesiden har sin egen adresse, #stjerner. Det gjør at den
   kan legges på Hjem-skjermen som eget ikon, og at tilbake-gesten
   i Safari virker som barna forventer — uten å dele opp filen. */

function visStjerner() {
  document.getElementById('stjerneside').hidden = false;
  tegnStjerneside();
}

function skjulStjerner() {
  document.getElementById('stjerneside').hidden = true;
  tegnAlt();
}

function aapneStjerner() {
  if (location.hash === '#stjerner') visStjerner();
  else location.hash = 'stjerner';
}

function tilbakeFraStjerner() {
  if (location.hash === '#stjerner') history.back();
  else skjulStjerner();
}

window.addEventListener('hashchange', () => {
  if (location.hash === '#stjerner') visStjerner();
  else skjulStjerner();
});

/* Liten teller i dagsvisningens kolonneoverskrift */
function kolonneStjerner(barn, noekkel) {
  const oppgaver = CONFIG.oppgaver[barn.id] || [];
  if (!oppgaver.length) return '';
  const antall = gjortIDag(barn.id, noekkel).length;
  const alle = antall === oppgaver.length;
  return `<div class="kol-stjerner ${alle ? 'alle' : ''}">
    ${'⭐'.repeat(antall)}${'·'.repeat(oppgaver.length - antall)} ${antall}/${oppgaver.length}</div>`;
}

const alleGjort = (barn, noekkel) => {
  const oppgaver = CONFIG.oppgaver[barn.id] || [];
  return oppgaver.length > 0 && gjortIDag(barn.id, noekkel).length === oppgaver.length;
};

function tegnAlt() {
  const rutenett = document.getElementById('rutenett');
  const ukeboks = document.getElementById('uke');

  tegnStengtvarsel();
  ukeboks.hidden = true;

  if (visning === 'uke') {
    rutenett.style.display = 'none';
    ukeboks.hidden = false;
    document.querySelector('.naa-linje')?.remove();
    tegnUke();
    tegnDato();
    tegnHusk([]);
    document.getElementById('varsel').hidden = !kalenderFeil;
    if (kalenderFeil) document.getElementById('varsel').textContent = `Bare Sofia vises: ${kalenderFeil}`;
    return;
  }

  rutenett.style.display = '';

  sisteData = byggDag();
  tegnDato();
  tegnRutenett(sisteData);
  tegnHusk(sisteData.husk);
  tegnVaertopp();

  const varsel = document.getElementById('varsel');
  if (kalenderFeil) {
    varsel.textContent = `Bare Sofia vises: ${kalenderFeil}`;
    varsel.hidden = false;
  } else {
    varsel.hidden = true;
  }
}

async function last() {
  const status = document.getElementById('status');
  try {
    await hentKalenderfil();
    await hentStjernerFraSky();
    tegnAlt();
    status.classList.remove('feil');
  } catch (e) { console.error(e); status.classList.add('feil'); }
}

lesLokalt();

let visning = 'dag';

document.getElementById('knappIdag').addEventListener('click', () => {
  visning = 'dag'; dagOffset = 0; tegnAlt();
});
document.getElementById('knappImorgen').addEventListener('click', () => {
  visning = 'dag'; dagOffset = 1; tegnAlt();
});
document.getElementById('knappUke').addEventListener('click', () => {
  visning = 'uke'; tegnAlt();
});
document.getElementById('knappOppgaver').addEventListener('click', aapneStjerner);

/* Knappen sykler lys, mørk, auto. Auto er lys om dagen og mørk
   om kvelden. Valget lagres på denne skjermen, så iPaden kan stå
   lyst mens telefonen står mørkt. */
document.getElementById('knappTema').addEventListener('click', () => {
  temaValg = temaValg === 'lys' ? 'mork' : (temaValg === 'mork' ? 'auto' : 'lys');
  try { localStorage.setItem('familietavla-tema', temaValg); } catch (e) {}
  settTema(true);
  tegnAlt();
});

try {
  const lagret = localStorage.getItem('familietavla-tema');
  if (lagret) temaValg = lagret;
} catch (e) {}

/* Fullskjerm. Støttes ikke på iPhone og er unødvendig når tavla
   åpnes fra Hjem-skjermen, så knappen skjules der den ikke virker. */
(function () {
  const knapp = document.getElementById('knappFullskjerm');
  const staaende = window.navigator.standalone
    || window.matchMedia('(display-mode: standalone)').matches;

  if (staaende || !document.documentElement.requestFullscreen) {
    knapp.hidden = true;
    return;
  }

  knapp.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  document.addEventListener('fullscreenchange', () => {
    knapp.textContent = document.fullscreenElement ? '⤡' : '⛶';
  });
})();

settTema(true);
oppdaterKlokke();
hentVaer().then(() => { if (sisteData) tegnAlt(); });
last().then(() => {
  // Åpnet via #stjerner, for eksempel fra et eget ikon på Hjem-skjermen
  if (location.hash === '#stjerner') visStjerner();
});

setInterval(oppdaterKlokke, 15000);
setInterval(last, CONFIG.dataIntervallMin * 60 * 1000);
setInterval(() => hentVaer().then(() => { if (sisteData) tegnAlt(); }), 20 * 60 * 1000);
let endreTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(endreTimer);
  endreTimer = setTimeout(() => { if (sisteData) tegnAlt(); }, 150);
});

if ('wakeLock' in navigator) {
  const hold = () => navigator.wakeLock.request('screen').catch(() => {});
  hold();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') hold();
  });
}
</script>
