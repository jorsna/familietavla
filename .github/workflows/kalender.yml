name: Hent familiekalender

on:
  schedule:
    # Hver halvtime mellom 06 og 21 norsk tid (cron er i UTC)
    - cron: '0,30 4-19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: true

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer avhengigheter
        run: npm install node-ical

      - name: Hent kalender
        env:
          ICAL_FAMILIE: ${{ secrets.ICAL_FAMILIE }}
          ICAL_JORGEN: ${{ secrets.ICAL_JORGEN }}
          ICAL_SEBASTIAN: ${{ secrets.ICAL_SEBASTIAN }}
          ICAL_ELLIE: ${{ secrets.ICAL_ELLIE }}
        run: node scripts/hent-kalender.mjs

      # Valgfritt: krever både scripts/paaminnelser.mjs og en
      # ANTHROPIC_API_KEY. Mangler noen av delene, hoppes steget over
      # uten å stoppe resten av jobben.
      - name: Lag påminnelser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f scripts/paaminnelser.mjs ]; then
            node scripts/paaminnelser.mjs
          else
            echo "scripts/paaminnelser.mjs finnes ikke. Hopper over."
          fi

      # ────────────────────────────────────────────────────────────
      # Datafilene legges på en egen branch, ikke på main.
      # Da starter de ingen Pages-publisering, og opplastingene
      # dine slipper å stå i kø bak dem.
      #
      # Roboten rører BARE filene den selv lager. Alt annet du har
      # lastet opp til data-branchen — aks.json, middager.json,
      # manuelt.json — blir stående urørt.
      # ────────────────────────────────────────────────────────────
      - name: Publiser til data-branchen
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          rm -rf /tmp/datagren
          mkdir -p /tmp/datagren
          cd /tmp/datagren
          git init -q
          git config user.name "Familietavla"
          git config user.email "actions@github.com"
          git remote add origin "$REPO"

          if git fetch -q --depth 1 origin data 2>/dev/null; then
            git checkout -q -b data FETCH_HEAD
            echo "Bygger videre på eksisterende data-branch."
          else
            git checkout -q -b data
            echo "Oppretter data-branchen."
          fi

          # Bare robotens egne filer kopieres over
          for f in kalender.json stengt.json paaminnelser.json; do
            if [ -f "$GITHUB_WORKSPACE/data/$f" ]; then
              cp "$GITHUB_WORKSPACE/data/$f" .
            fi
          done

          git add -A
          if git diff --staged --quiet; then
            echo "Ingen endringer."
          else
            git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M')"
            git push -q origin data
            echo "Publiserte til data-branchen. Filer nå: $(ls -1 | wc -l)"
          fi
