name: Hent familiekalender

on:
  schedule:
    # Hver halvtime mellom 06 og 21 norsk tid (cron er i UTC)
    - cron: '0,30 4-19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: true

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer avhengigheter
        run: npm install node-ical

      - name: Hent kalender
        env:
          ICAL_FAMILIE: ${{ secrets.ICAL_FAMILIE }}
          ICAL_JORGEN: ${{ secrets.ICAL_JORGEN }}
          ICAL_SEBASTIAN: ${{ secrets.ICAL_SEBASTIAN }}
          ICAL_ELLIE: ${{ secrets.ICAL_ELLIE }}
        run: node scripts/hent-kalender.mjs

      # Valgfritt: krever både scripts/paaminnelser.mjs og en
      # ANTHROPIC_API_KEY. Mangler noen av delene, hoppes steget over
      # uten å stoppe resten av jobben.
      - name: Lag påminnelser
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f scripts/paaminnelser.mjs ]; then
            node scripts/paaminnelser.mjs
          else
            echo "scripts/paaminnelser.mjs finnes ikke. Hopper over."
          fi

      # ────────────────────────────────────────────────────────────
      # Datafilene legges på en egen branch, ikke på main.
      # Da starter de ingen Pages-publisering, og opplastingene
      # dine slipper å stå i kø bak dem.
      #
      # Branchen bygges på nytt hver gang. Det er trygt fordi alt
      # den skal inneholde ligger i data/ her og nå — både det
      # skriptet nettopp laget og det du har lastet opp til main.
      # ────────────────────────────────────────────────────────────
      - name: Publiser til data-branchen
        run: |
          if [ -z "$(ls -A data 2>/dev/null)" ]; then
            echo "Ingen datafiler å publisere."
            exit 0
          fi

          rm -rf /tmp/datagren
          mkdir -p /tmp/datagren
          cp data/* /tmp/datagren/
          cd /tmp/datagren

          git init -q
          git checkout -q -b data
          git config user.name "Familietavla"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            data

          echo "Publiserte $(ls -1 | wc -l) filer til data-branchen."
